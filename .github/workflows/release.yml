name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Rust test suite
        run: cargo test -p lg-buddy

      - name: Run clippy
        run: cargo clippy -p lg-buddy --all-targets --all-features -- -D warnings

      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh configure.sh bin/LG_Buddy_Common scripts/build-release-bundle.sh scripts/test-release-bundle.sh scripts/publish-release-assets.sh scripts/promote-nix-release-channels.sh scripts/test-promote-nix-release-channels.sh

      - name: Test release-channel promotion helper
        run: ./scripts/test-promote-nix-release-channels.sh

  build-release-bundle:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools zenity

      - name: Validate release tag
        run: |
          ./scripts/promote-nix-release-channels.sh \
              --tag "$GITHUB_REF_NAME" \
              --validate-only

          version="${GITHUB_REF_NAME#v}"
          echo "LG_BUDDY_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build lg-buddy
        env:
          LG_BUDDY_BUILD_COMMIT: ${{ github.sha }}
        run: LG_BUDDY_RELEASE_VERSION="$LG_BUDDY_RELEASE_VERSION" cargo build --release -p lg-buddy --target x86_64-unknown-linux-musl

      - name: Create release bundle
        run: ./scripts/build-release-bundle.sh --target x86_64-unknown-linux-musl --version "$LG_BUDDY_RELEASE_VERSION" --output-dir dist

      - name: Smoke test release bundle
        run: ./scripts/test-release-bundle.sh --skip-pip-install --archive "dist/lg-buddy-${LG_BUDDY_RELEASE_VERSION}-x86_64-unknown-linux-musl.tar.gz"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > sha256sums.txt

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c sha256sums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lg-buddy-release-bundle
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release-assets.sh --dist-dir dist

      - name: Promote Nix release-channel refs
        run: |
          ./scripts/promote-nix-release-channels.sh \
              --tag "$GITHUB_REF_NAME" \
              --expected-commit "$GITHUB_SHA"

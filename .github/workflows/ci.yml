name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

env:
  SMOKE_VERSION: 2.0.0-beta.1.ci

jobs:
  kwin-bridges:
    uses: ./.github/workflows/kwin-bridge.yml

  nix-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Evaluate public package outputs
        run: nix flake check --no-build --all-systems
      - name: Build and exercise the installed package
        run: nix build --print-build-logs --no-link --cores 2 --max-jobs 2 .#checks.x86_64-linux.package
      - name: Verify update ownership on the real store filesystem
        run: |
          package="$(nix eval --raw .#packages.x86_64-linux.lg-buddy.outPath)"
          bash scripts/test-nix-update-ownership.sh "$package"
          python3 scripts/test-declarative-settings.py "$package/bin/lg-buddy" --nix

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify root-scoped ownership behavior
        run: |
          # Ask Cargo for the exact test executable;
          # globbing target/debug/deps can select a stale test binary.
          test_binary="$(cargo test --locked -p lg-buddy --lib --no-run --message-format=json | python3 -c '
          import json, sys
          artifacts = [json.loads(line) for line in sys.stdin]
          executables = [item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "lg_buddy"
                         and item["target"]["kind"] == ["lib"]
                         and item["profile"]["test"] and item.get("executable")]
          assert len(executables) == 1, executables
          print(executables[0])')"
          # Owner subprocesses must reach the binary even if the checkout's
          # parent directories are private to the runner account.
          install -m 755 "$test_binary" target/native-package-tests
          strip --strip-debug target/native-package-tests
          privileged_test_dir="$(mktemp -d)"
          trap 'rm -rf "$privileged_test_dir"' EXIT
          chmod 755 "$privileged_test_dir"
          install -m 755 "$test_binary" "$privileged_test_dir/lib-tests"
          test_binary="$privileged_test_dir/lib-tests"
          for test in \
            platform_access_token::tests::persist_assigns_requested_owner_when_running_as_root \
            pairing_store::tests::mutation_lock_is_shared_by_root_and_config_owner \
            pairing_store::tests::mutation_lock_rejects_unsafe_existing_markers \
            setup::kwin::native::tests::system_install_validates_artifacts_and_preserves_existing_files \
            setup::kwin::native::tests::legacy_lock_migration_preserves_foreign_owned_files \
            pairing_store::migration::tests::migration_preserves_config_access_metadata \
            config::declarative::tests::root_reads_user_owned_declarations_without_materializing_or_bypassing_management; do
            "$test_binary" --list --format=terse | grep -Fx "$test: test"
            sudo env TMPDIR="$privileged_test_dir" "$test_binary" "$test" --exact
          done

      - name: Save native package verification tests
        uses: actions/upload-artifact@v6
        with:
          name: ci-native-package-tests
          path: target/native-package-tests
          if-no-files-found: error

      - name: Install GTK test prerequisites
        run: |
          # Chrome is unused; its third-party index must not block Ubuntu dependencies.
          sudo rm -fv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # Avoid slow Azure mirror downloads consuming the test job's time budget.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y at-spi2-core bubblewrap dbus-x11 gjs libadwaita-1-dev libglib2.0-bin libgtk-4-dev pkexec python3-dbus python3-pyatspi xdotool xvfb

      - name: Enable setup CLI test namespaces
        # Match the disposable-runner preparation in the bundle smoke job.
        # Probe bwrap itself, since this is the sandbox used by the CLI tests.
        run: |
          if ! bwrap --ro-bind / / --dev /dev true >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev true

      - name: Run Rust test suite
        run: cargo test --locked -p lg-buddy

      - name: Run display-backed GTK test suite
        run: |
          cargo build -p lg-buddy -p lg-buddy-gui
          bash scripts/test-settings-compatibility.sh ./target/debug/lg-buddy
          python3 scripts/test-declarative-settings.py ./target/debug/lg-buddy
          cargo build --locked -p lg-buddy --example gui_journey_tv
          python3 scripts/test-tv-fixture.py ./target/debug/lg-buddy ./target/debug/examples/gui_journey_tv
          python3 scripts/test-setup-cli.py ./target/debug/lg-buddy ./target/debug/examples/gui_journey_tv
          dbus-run-session -- xvfb-run -a bash ./scripts/test-gui-launch.sh ./target/debug/lg-buddy-gui
          dbus-run-session -- xvfb-run -a bash ./scripts/test-gui-launch.sh ./target/debug/lg-buddy
          dbus-run-session -- xvfb-run -a bash ./scripts/test-installed-gui.sh \
              ./target/debug/lg-buddy \
              ./target/debug/lg-buddy-gui \
              ./target/debug/examples/gui_journey_tv
          dbus-run-session -- xvfb-run -a env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals NO_AT_BRIDGE=1 cargo test -p lg-buddy-gui -- --test-threads=1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Validate shell scripts
        run: |
          bash -n data/kwin/setup.sh data/kwin/build.sh scripts/test-kwin-plugin.sh scripts/test-kwin-distro.sh scripts/test-kwin-setup.sh scripts/test-gnome-extension.sh install.sh uninstall.sh configure.sh bin/LG_Buddy_Common scripts/build-release-bundle.sh scripts/test-gui-launch.sh scripts/test-installed-gui.sh scripts/test-installer-first-run.sh scripts/test-installer-gui-dependencies.sh scripts/test-installer-graphical-auth.sh scripts/test-release-bundle.sh scripts/test-release-gui-behavior.sh scripts/test-release-gui-journey.sh scripts/test-release-linkage.sh scripts/test-cross-version-upgrade.sh scripts/test-without-python.sh scripts/test-production-upgrade-canary.sh scripts/publish-release-assets.sh
          python3 -m py_compile scripts/test-release-gui-accessibility.py scripts/test-native-setup-recovery.py scripts/xwd_mean.py tools/mock_github_gui.py

      - name: Validate deterministic GUI GitHub fixture
        run: python3 scripts/test_mock_github_gui.py

      - name: Verify setup helpers and KWin fallbacks
        run: |
          bash -n data/setup-services.sh scripts/test-service-setup.sh
          bash scripts/test-service-setup.sh ./target/debug/lg-buddy
          bash scripts/test-kwin-setup.sh
          python3 scripts/test_kwin_matrix.py

      - name: Verify GNOME Shell extension
        run: bash scripts/test-gnome-extension.sh

      - name: Run first-run installer smoke
        run: |
          bash ./scripts/test-installer-first-run.sh
          bash ./scripts/test-automatic-configuration.sh

      - name: Validate release promotion contract
        run: python3 scripts/test_release_promotion.py

      - name: Validate release publication contract
        run: python3 scripts/test_publish_release_assets.py

      - name: Validate complete release asset identities
        run: |
          python3 scripts/test_release_assets.py
          python3 scripts/test_package_release_canary.py

      - name: Validate release bundle manifest contract
        run: python3 scripts/test_release_bundle_manifest.py

      - name: Validate Debian package input contract
        run: python3 scripts/test_build_debian_package.py

      - name: Validate RPM package input contract
        run: python3 scripts/test_build_rpm_package.py

      - name: Validate GitHub response recorder
        run: python3 scripts/test_record_github_release_responses.py

      - name: Build GUI journey fixtures
        env:
          LG_BUDDY_BUILD_COMMIT: ${{ github.sha }}
          LG_BUDDY_RELEASE_VERSION: "0.0.0"
        run: |
          # Reuse the GNU debug graph already built by the Rust/GTK checks.
          # The release bundle job only needs its optimized target graphs.
          cargo build --locked -p lg-buddy -p lg-buddy-gui --features gui-test-fixtures --bins --example gui_journey_tv
          mkdir -p target/gui-journey-fixtures
          cp target/debug/lg-buddy target/debug/lg-buddy-gui target/debug/examples/gui_journey_tv target/gui-journey-fixtures/

      - name: Upload GUI journey fixtures for supported-distro checks
        uses: actions/upload-artifact@v6
        with:
          name: ci-gui-journey-fixtures
          path: target/gui-journey-fixtures/*
          if-no-files-found: error
          retention-days: 7

  debian-package:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    needs: bundle-build
    steps:
      - name: Install package build and smoke prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates dbus-x11 dpkg-dev fonts-dejavu-core git libadwaita-1-0 libglib2.0-bin libgtk-4-1 passwd pkexec polkitd procps python3 sudo systemd xauth xdotool xvfb

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - name: Download debug-only updater transport fixtures
        uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: updater-fixtures

      - name: Build reproducible Debian packages
        shell: bash
        run: |
          archive=(dist/*.tar.gz)
          test "${#archive[@]}" = 1
          # The root container uses a checkout owned by the host runner.
          epoch="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)"
          python3 scripts/build_debian_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir dist
          python3 scripts/build_debian_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir dist --revision 2
          python3 scripts/build_debian_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir reproducible --revision 2
          cmp dist/*-2_amd64.deb reproducible/*-2_amd64.deb

      - name: Verify native package lifecycle and startup migration
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: bash scripts/test-debian-package.sh dist/*-1_amd64.deb dist/*-2_amd64.deb

      - name: Verify installed APT update and user GUI handoff
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: |
          python3 scripts/test-debian-update.py \
            --archive dist/*.tar.gz --package dist/*-1_amd64.deb \
            --runtime-fixture updater-fixtures/lg-buddy \
            --gui-fixture updater-fixtures/lg-buddy-gui

      - uses: actions/upload-artifact@v6
        with:
          name: ci-debian-package
          path: dist/*-1_amd64.deb
          if-no-files-found: error

  rpm-package:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    needs: bundle-build
    steps:
      - name: Install RPM build and smoke prerequisites
        run: |
          dnf5 install -y --setopt=install_weak_deps=False binutils dbus-daemon dbus-tools dejavu-sans-fonts diffutils findutils git gtk4 libadwaita polkit procps-ng python3 python3-rpm rpm-build shadow-utils sudo systemd tar util-linux xdotool xorg-x11-server-Xvfb xorg-x11-xauth

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - name: Download updater transport fixtures
        uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: updater-fixtures

      - name: Download native verification tests
        uses: actions/download-artifact@v7
        with:
          name: ci-native-package-tests
          path: native-tests

      - name: Verify RPM acquisition and privileged receipt
        run: |
          chmod 755 native-tests/native-package-tests
          native-tests/native-package-tests release_bundle::rpm:: --nocapture

      - name: Verify native RPM version ordering and package inputs
        run: python3 scripts/test_build_rpm_package.py

      - name: Build reproducible RPM packages
        shell: bash
        run: |
          archive=(dist/*.tar.gz)
          test "${#archive[@]}" = 1
          epoch="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)"
          python3 scripts/test-rpm-optional-dependencies.py --archive "${archive[0]}" --source-date-epoch "$epoch"
          python3 scripts/build_rpm_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir dist
          python3 scripts/build_rpm_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir dist --revision 2
          python3 scripts/build_rpm_package.py --archive "${archive[0]}" --source-date-epoch "$epoch" --output-dir reproducible --revision 2
          cmp dist/*-2.x86_64.rpm reproducible/*-2.x86_64.rpm

      - name: Verify native RPM lifecycle and startup migration
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: bash scripts/test-rpm-package.sh dist/*-1.x86_64.rpm dist/*-2.x86_64.rpm

      - name: Verify DNF update handoff
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: |
          chmod 755 updater-fixtures/*
          python3 scripts/test-debian-update.py --format rpm \
            --archive dist/*.tar.gz --package dist/*-1.x86_64.rpm \
            --runtime-fixture updater-fixtures/lg-buddy \
            --gui-fixture updater-fixtures/lg-buddy-gui

      - uses: actions/upload-artifact@v6
        with:
          name: ci-rpm-package
          path: dist/*-1.x86_64.rpm
          if-no-files-found: error

  dnf-update-fedora44:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    needs: rpm-package
    steps:
      - name: Install DNF replay and GUI prerequisites
        run: dnf5 install -y --setopt=install_weak_deps=False binutils dbus-daemon dbus-tools dejavu-sans-fonts findutils git gtk4 libadwaita polkit procps-ng python3 rpm-build shadow-utils sudo systemd tar util-linux xdotool xorg-x11-server-Xvfb xorg-x11-xauth

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: ci-rpm-package
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: updater-fixtures

      - uses: actions/download-artifact@v7
        with:
          name: ci-native-package-tests
          path: native-tests

      - name: Verify stored RPM signature enforcement
        shell: bash
        run: |
          dnf5 download --destdir signature-fixtures libglvnd-gles.x86_64
          signed=(signature-fixtures/*.rpm)
          unsigned=(dist/*.rpm)
          test "${#signed[@]}" = 1
          test "${#unsigned[@]}" = 1
          chmod 755 native-tests/native-package-tests
          LG_BUDDY_TEST_SIGNED_RPM="$(realpath "${signed[0]}")" \
            LG_BUDDY_TEST_UNSIGNED_RPM="$(realpath "${unsigned[0]}")" \
            native-tests/native-package-tests rpm_update:: --nocapture

      - name: Verify DNF update adds an absent repository dependency
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: |
          rpm -q dnf5 libdnf5
          chmod 755 updater-fixtures/*
          python3 scripts/test-debian-update.py --format rpm \
            --archive dist/*.tar.gz --package dist/*.rpm \
            --runtime-fixture updater-fixtures/lg-buddy \
            --gui-fixture updater-fixtures/lg-buddy-gui \
            --expect-new-rpm-dependency libglvnd-gles

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-fedora44-dnf-update
          path: /home/lgdeb-update/update-*.output
          if-no-files-found: warn

  rpm-update-fedora43-refusal:
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 10
    needs: rpm-package
    steps:
      - name: Install refusal-test prerequisites
        run: dnf5 install -y --setopt=install_weak_deps=False binutils gtk4 libadwaita python3 rpm-build shadow-utils sudo util-linux
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: ci-rpm-package
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: updater-fixtures
      - name: Require guidance before discovery, authorization or mutation
        shell: bash
        env:
          LG_BUDDY_DISPOSABLE_PACKAGE_TEST: "1"
        run: |
          chmod 755 updater-fixtures/*
          python3 scripts/test-debian-update.py --format rpm \
            --archive dist/*.tar.gz --package dist/*.rpm \
            --runtime-fixture updater-fixtures/lg-buddy \
            --gui-fixture updater-fixtures/lg-buddy-gui \
            --expect-unsupported-rpm-platform

  release-assets:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 10
    needs: [bundle-build, debian-package, rpm-package]
    steps:
      - name: Install non-installing package decoders
        run: dnf5 install -y --setopt=install_weak_deps=False dpkg git python3 rpm

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: ci-debian-package
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: ci-rpm-package
          path: dist

      - name: Verify and assemble all real release formats together
        run: |
          python3 scripts/release_assets.py --dist-dir dist --tag "v$SMOKE_VERSION" --commit "$GITHUB_SHA" --write-checksums
          python3 scripts/release_assets.py --dist-dir dist --tag "v$SMOKE_VERSION" --commit "$GITHUB_SHA"
          GH_RELEASE_DRY_RUN=1 bash scripts/publish-release-assets.sh stage-draft --dist-dir dist --tag "v$SMOKE_VERSION" --commit "$GITHUB_SHA"

  bundle-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [verify, kwin-bridges]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build prerequisites
        run: |
          # Chrome is unused; its third-party index must not block Ubuntu dependencies.
          sudo rm -fv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # Avoid slow Azure mirror downloads consuming the build job's time budget.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y binutils libadwaita-1-dev libgtk-4-dev musl-tools

      - name: Build headless runtime and GTK GUI
        env:
          LG_BUDDY_BUILD_COMMIT: ${{ github.sha }}
          LG_BUDDY_RELEASE_VERSION: ${{ env.SMOKE_VERSION }}
        run: |
          pkg-config --atleast-version=4.14 gtk4
          pkg-config --atleast-version=1.5 libadwaita-1
          cargo build --locked --release -p lg-buddy --target x86_64-unknown-linux-musl
          cargo build --locked --release -p lg-buddy-gui --target x86_64-unknown-linux-gnu

      - name: Download verified KWin plugins
        uses: actions/download-artifact@v7
        with:
          pattern: kwin-bridge-*
          merge-multiple: true
          path: target/kwin-bridges

      - name: Create release bundle
        run: |
          umask 0002
          ./scripts/build-release-bundle.sh --target x86_64-unknown-linux-musl --gui-target x86_64-unknown-linux-gnu --version "$SMOKE_VERSION" --output-dir dist --require-kwin-matrix

      - name: Upload bundle for supported-distro checks
        uses: actions/upload-artifact@v6
        with:
          name: ci-release-bundle
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  bundle-smoke-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: bundle-build
    strategy:
      fail-fast: false
      matrix:
        suite: [release-bundle, installed-gui, cross-version-upgrade, v1-migration]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install smoke-test prerequisites
        run: |
          # Chrome is unused; its third-party index must not block Ubuntu dependencies.
          sudo rm -fv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # Avoid slow Azure mirror downloads consuming the smoke job's time budget.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y at-spi2-core binutils dbus-x11 libadwaita-1-dev libgtk-4-dev pkexec python3-dbus python3-pyatspi python3-venv strace xdotool xvfb
          # Prove current installation and GUI behavior without the retired dialog tool or external idle command.
          sudo apt-get purge -y zenity swayidle

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - name: Download GUI journey fixtures
        uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: target/gui-journey-fixtures

      - name: Restore executable permissions on downloaded fixtures
        run: chmod 755 target/gui-journey-fixtures/*

      - name: Enable graphical authorization smoke namespaces
        # Ubuntu 24.04 may restrict unprivileged user namespaces through
        # AppArmor. Relax only that disposable runner setting for the
        # isolated graphical-authorization fixture; the final probe keeps
        # this lane mandatory if the namespace contract is still unavailable.
        run: |
          if ! unshare -Ur true >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Ur true

      - name: Smoke test release bundle
        if: matrix.suite == 'release-bundle'
        run: |
          if command -v zenity; then
            echo "Release-bundle smoke requires a host without Zenity." >&2
            exit 1
          fi
          dbus-run-session -- xvfb-run -a env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals NO_AT_BRIDGE=1 \
              LG_BUDDY_GUI_TV_FIXTURE="$PWD/target/gui-journey-fixtures/gui_journey_tv" \
              ./scripts/test-release-bundle.sh \
              --work-dir "$RUNNER_TEMP/release-bundle-smoke" \
              --archive "dist/lg-buddy-${SMOKE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              --expected-tag "v${SMOKE_VERSION}" \
              --expected-version "$SMOKE_VERSION" \
              --expected-channel prerelease \
              --expected-target x86_64-unknown-linux-musl \
              --expected-commit "${{ github.sha }}"

      - name: Smoke test installed GUI journey
        if: matrix.suite == 'installed-gui'
        run: |
          dbus-run-session -- xvfb-run -a env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals NO_AT_BRIDGE=1 \
              bash ./scripts/test-installed-gui.sh \
              target/gui-journey-fixtures/lg-buddy \
              target/gui-journey-fixtures/lg-buddy-gui \
              target/gui-journey-fixtures/gui_journey_tv \
              "dist/lg-buddy-${SMOKE_VERSION}-x86_64-unknown-linux-musl.tar.gz"

      - name: Download pinned cross-version baseline
        if: matrix.suite == 'cross-version-upgrade'
        run: |
          curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              https://github.com/Staphylococcus/LG_Buddy/releases/download/v1.4.0-beta.2/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz

      - name: Smoke test cross-version upgrade
        if: matrix.suite == 'cross-version-upgrade'
        run: |
          ./scripts/test-cross-version-upgrade.sh \
              --previous-archive "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              --previous-sha256 883e6cb869cbe60988a195acac2e15864d904797edfefbb7d90052eff9a17d32 \
              --previous-tag v1.4.0-beta.2 \
              --previous-version 1.4.0-beta.2 \
              --previous-channel prerelease \
              --previous-target x86_64-unknown-linux-musl \
              --previous-commit 77c8f46c66b9e385f3d90c15dee33d775639bbeb \
              --candidate-archive "dist/lg-buddy-${SMOKE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              --candidate-tag "v${SMOKE_VERSION}" \
              --candidate-version "$SMOKE_VERSION" \
              --candidate-channel prerelease \
              --candidate-target x86_64-unknown-linux-musl \
              --candidate-commit "${{ github.sha }}"

      - name: Download pinned published v1.8 baseline
        if: matrix.suite == 'v1-migration'
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/lg-buddy-1.8.0-x86_64-unknown-linux-musl.tar.gz" \
              https://github.com/Staphylococcus/LG_Buddy/releases/download/v1.8.0/lg-buddy-1.8.0-x86_64-unknown-linux-musl.tar.gz

      - name: Verify v1.8 payload upgrade before installed GUI startup migration
        if: matrix.suite == 'v1-migration'
        run: |
          dbus-run-session -- xvfb-run -a env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 \
              /usr/bin/python3 scripts/test-v1-bundle-migration.py \
              --previous-archive "$RUNNER_TEMP/lg-buddy-1.8.0-x86_64-unknown-linux-musl.tar.gz" \
              --candidate-archive "dist/lg-buddy-$SMOKE_VERSION-x86_64-unknown-linux-musl.tar.gz" \
              --expected-tag "v$SMOKE_VERSION" --expected-commit "$GITHUB_SHA" \
              --work-dir "$RUNNER_TEMP/v1-migration"

      - name: Upload v1.8 migration evidence
        if: always() && matrix.suite == 'v1-migration'
        uses: actions/upload-artifact@v6
        with:
          name: v1-bundle-migration
          path: |
            ${{ runner.temp }}/v1-migration/**/*.output
            ${{ runner.temp }}/v1-migration/**/result.json
          if-no-files-found: warn

  bundle-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [bundle-build, bundle-smoke-suites, bundle-supported-distros, debian-package, rpm-package, dnf-update-fedora44, rpm-update-fedora43-refusal, release-assets]
    # Keep the required check failing when production or any suite fails,
    # times out, or is skipped, even after an upstream failure.
    if: ${{ always() }}
    steps:
      - name: Require every bundle, distribution and native package smoke suite to pass
        env:
          BUILD_RESULT: ${{ needs.bundle-build.result }}
          SMOKE_RESULT: ${{ needs.bundle-smoke-suites.result }}
          DISTRO_RESULT: ${{ needs.bundle-supported-distros.result }}
          DEBIAN_RESULT: ${{ needs.debian-package.result }}
          RPM_RESULT: ${{ needs.rpm-package.result }}
          DNF_RESULT: ${{ needs.dnf-update-fedora44.result }}
          RPM_REFUSAL_RESULT: ${{ needs.rpm-update-fedora43-refusal.result }}
          ASSETS_RESULT: ${{ needs.release-assets.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$SMOKE_RESULT" != success ] || [ "$DISTRO_RESULT" != success ] || [ "$DEBIAN_RESULT" != success ] || [ "$RPM_RESULT" != success ] || [ "$DNF_RESULT" != success ] || [ "$RPM_REFUSAL_RESULT" != success ] || [ "$ASSETS_RESULT" != success ]; then
            echo "Bundle build: $BUILD_RESULT; smoke suites: $SMOKE_RESULT; supported distributions: $DISTRO_RESULT; Debian package: $DEBIAN_RESULT; RPM package: $RPM_RESULT; DNF update: $DNF_RESULT; Fedora 43 refusal: $RPM_REFUSAL_RESULT; release assets: $ASSETS_RESULT" >&2
            exit 1
          fi

  bundle-supported-distros:
    needs: bundle-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44
            image: fedora:44
            package_manager: dnf
            setup: dnf install -y at-spi2-core binutils curl dbus-x11 findutils glib2 gobject-introspection gsettings-desktop-schemas gtk4 gzip libadwaita libglvnd-gles polkit procps-ng python3 python3-dbus python3-pyatspi shadow-utils strace tar util-linux which xdotool xorg-x11-server-Xvfb xorg-x11-xauth xwd
          - name: Arch current
            image: archlinux:latest
            package_manager: pacman
            setup: pacman -Syu --noconfirm at-spi2-core binutils curl dbus diffutils glib2 gtk4 gzip libadwaita polkit procps-ng python python-atspi python-dbus shadow strace tar util-linux which xdotool xorg-server-xvfb xorg-xauth xorg-xwd
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined

    steps:
      - name: Install ${{ matrix.name }} prerequisites
        run: ${{ matrix.setup }}

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: ci-release-bundle
          path: dist

      - name: Download GUI journey fixtures
        uses: actions/download-artifact@v7
        with:
          name: ci-gui-journey-fixtures
          path: gui-journey-fixtures

      - name: Install and launch the packaged GUI on ${{ matrix.name }}
        shell: bash
        run: |
          useradd --create-home tester
          # runuser in these containers has no logind session to create this.
          # Onboarding uses the canonical per-user runtime directory for its lock.
          install -d -m 700 -o tester -g "$(id -gn tester)" "/run/user/$(id -u tester)"
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          extraction="$(mktemp -d)"
          tar --no-same-owner -C "$extraction" -xzf "$archive"
          bundle="$(find "$extraction" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          chmod 755 gui-journey-fixtures/*
          chmod -R a+rX "$extraction" "$GITHUB_WORKSPACE"
          runuser -u tester -- bash ./scripts/test-release-linkage.sh \
              "$bundle/lg-buddy" \
              "$bundle/docs/lg-buddy-gui-x86_64-unknown-linux-gnu"
          runuser -u tester -- bash ./scripts/test-installer-gui-dependencies.sh \
              "$bundle/install.sh" \
              "$bundle/lg-buddy" \
              "$bundle/docs/lg-buddy-gui-x86_64-unknown-linux-gnu" \
              "${{ matrix.package_manager }}"
          runuser -u tester -- dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
              env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals LG_BUDDY_TEST_PLATFORM_CONTRACT=1 \
              bash ./scripts/test-installed-gui.sh \
              "$bundle/lg-buddy" \
              "$bundle/docs/lg-buddy-gui-x86_64-unknown-linux-gnu"
          runuser -u tester -- dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
              env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals LG_BUDDY_TEST_PLATFORM_CONTRACT=1 \
              bash ./scripts/test-installed-gui.sh \
              "$GITHUB_WORKSPACE/gui-journey-fixtures/lg-buddy" \
              "$GITHUB_WORKSPACE/gui-journey-fixtures/lg-buddy-gui" \
              "$GITHUB_WORKSPACE/gui-journey-fixtures/gui_journey_tv" \
              "$archive"

      - name: Upgrade the pinned baseline on ${{ matrix.name }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output /tmp/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz \
              https://github.com/Staphylococcus/LG_Buddy/releases/download/v1.4.0-beta.2/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          chmod a+r /tmp/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz "$archive"
          runuser -u tester -- bash ./scripts/test-cross-version-upgrade.sh \
              --previous-archive /tmp/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz \
              --previous-sha256 883e6cb869cbe60988a195acac2e15864d904797edfefbb7d90052eff9a17d32 \
              --previous-tag v1.4.0-beta.2 \
              --previous-version 1.4.0-beta.2 \
              --previous-channel prerelease \
              --previous-target x86_64-unknown-linux-musl \
              --previous-commit 77c8f46c66b9e385f3d90c15dee33d775639bbeb \
              --candidate-archive "$archive" \
              --candidate-tag "v${SMOKE_VERSION}" \
              --candidate-version "$SMOKE_VERSION" \
              --candidate-channel prerelease \
              --candidate-target x86_64-unknown-linux-musl \
              --candidate-commit "${{ github.sha }}"
